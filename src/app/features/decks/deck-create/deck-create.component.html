<form class="screen" (submit)="$event.preventDefault(); save()">
  <mat-toolbar>
    <span class="toolbar-section">
      <button mat-icon-button type="button" (click)="cancel()" aria-label="Cancel">
        <mat-icon>close</mat-icon>
      </button>
      <span>New deck</span>
    </span>
    <button
      mat-flat-button
      type="submit"
      [disabled]="deckForm().invalid() || deckForm().submitting()"
    >
      <mat-icon>save</mat-icon>
      Save
    </button>
  </mat-toolbar>

  <div class="content">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [formField]="deckForm.name" placeholder="e.g. C# Fundamentals" autofocus />
      @if (deckForm.name().invalid()) {
        <mat-error>{{ deckForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description (optional)</mat-label>
      <textarea
        matInput
        [formField]="deckForm.description"
        rows="3"
        placeholder="What's this deck for?"
      ></textarea>
    </mat-form-field>
  </div>
</form>
